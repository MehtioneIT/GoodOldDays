<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anasehife</title>
    <link href="Css/index.css" rel="stylesheet">

    <style>
        th{
            text-align: left;
        }
    </style>

    <script src="js/index.js"></script>

</head>
<body>

<h1>Teachers</h1>

<div class="container">
    <div class="row">
        <div class="col-auto">
            <label for="name" class="visually-hidden">Name</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="name" value="">
        </div>
        <div class="col-auto">
            <label for="surname" class="visually-hidden">surname</label>
            <input type="text" class="form-control" id="surname" name="surname" placeholder="surname" value="">
        </div>

        <div class="col-auto">
            <label for="age" class="visually-hidden">age</label>
            <input type="text" class="form-control" id="age" name="age" placeholder="age" value="">
        </div>

        <div class="col-auto">
            <label for="email" class="visually-hidden">email</label>
            <input type="text" class="form-control" id="email" name="email" placeholder="email"value="">
        </div>

        <div class="col-auto">
            <label for="email" class="visually-hidden">email</label>
            <select  class="form-select" name="university" id="university_id">
                <option value="">Select University</option>
                <option value="1" >BDU</option>
                <option value="2">SDU</option>
                <option value="3">AzTu</option>
            </select>

        </div>
    </div>

    <div class="row">
        <div class="col-3">
            <button type="button" class="btn btn-primary mb-3" onclick="getTeacher()">Search</button>
        </div>

        <div class="col-auto">
            <button type="button" class="btn btn-primary mb-3" data-toggle="modal"
            data-target="#modalTeachersInsert">Insert</button>
        </div>
    </div>

</div>



<table class="table">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Surname</th>
        <th>Age</th>
        <th>Email</th>
        <th>University</th>
    </tr>
    </thead>

    <tbody id="tbl-teachers-body"></tbody>

</table>



<table style="display: none">
    <tbody id="teacher-row-template">
    <tr>
        <td>:id</td>
        <td>:name</td>
        <td>:surname</td>
        <td>:age</td>
        <td>:email</td>
        <td>:university</td>
        <td>
            <button onclick="select(:id)" class="btn btn-danger" data-toggle="modal" data-target="#modalTeachersDelete">Delete</button>
            <button onclick="selectForUpdate(:index)" class="btn btn-info" data-toggle="modal" data-target="#modalTeachersUpdate">Update</button>
        </td>
    </tr>
    </tbody>
</table>


<!-- Modal -->
<div class="modal fade" id="modalTeachersDelete" tabindex="-1" role="dialog" aria-labelledby="TeachersDeleteModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="TeachersDeleteModalLabel">Modal title</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                Are you sure to delete
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">No</button>
                <button type="button" class="btn btn-danger" onclick="deleteTeacher(selectedId)" data-dismiss="modal">Yes</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modalTeachersInsert" tabindex="-1" role="dialog"
     aria-labelledby="modalTeachersInsertLabel" aria-hidden="true">
    <div class="modal-dialog" role="document" id="create_teacher">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTeachersInsertLabel">Create Student</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="container">
                    <div class="row">
                        <div class="col-auto">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="create_name" name="name" placeholder="name" />
                        </div>

                        <div class="col-auto">
                            <label for="surname" class="form-label">surname</label>
                            <input type="text" class="form-control" id="create_surname" name="surname" placeholder="surname" />
                        </div>

                        <div class="col-auto">
                            <label for="age" class="form-label">age</label>
                            <input type="text" class="form-control" id="create_age" name="age" placeholder="age" />
                        </div>

                        <div class="col-auto">
                            <label for="email" class="form-label">email</label>
                            <input type="text" class="form-control" id="create_email" name="email" placeholder="email"/>
                        </div>

                        <div class="col-auto">
                            <label for="university_id" class="form-label">University</label>
                            <select  class="form-select" name="university_id" id="create_university_id" >
                                <option value="">Select University</option>
                                <option value="1" >BDU</option>
                                <option value="2">SDU</option>
                                <option value="3">AzTu</option>
                            </select>

                        </div>
                    </div>
                </div>

            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">No</button>
                <button type="button" class="btn btn-danger" onclick="insertTeacher()" data-dismiss="modal">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modalTeachersUpdate" tabindex="-1" role="dialog"
     aria-labelledby="modalTeachersInsertLabel" aria-hidden="true">
    <div class="modal-dialog" role="document" id="update_teacher">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTeachersUpdateLabel">Updates Student</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="container">
                    <div class="row">
                        <div class="col-auto">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="update_name" name="name" placeholder="name" />
                        </div>

                        <div class="col-auto">
                            <label for="surname" class="form-label">surname</label>
                            <input type="text" class="form-control" id="update_surname" name="surname" placeholder="surname" />
                        </div>

                        <div class="col-auto">
                            <label for="age" class="form-label">age</label>
                            <input type="text" class="form-control" id="update_age" name="age" placeholder="age" />
                        </div>

                        <div class="col-auto">
                            <label for="email" class="form-label">email</label>
                            <input type="text" class="form-control" id="update_email" name="email" placeholder="email"/>
                        </div>

                        <div class="col-auto">
                            <label for="university_id" class="form-label">University</label>
                            <select  class="form-select" name="university_id" id="update_university_id" >
                                <option value="">Select University</option>
                                <option value="1" >BDU</option>
                                <option value="2">SDU</option>
                                <option value="3">AzTu</option>
                            </select>

                        </div>
                    </div>
                </div>

            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">No</button>
                <button type="button" class="btn btn-danger" onclick="updateTeacher()" data-dismiss="modal">Save</button>
            </div>
        </div>
    </div>
</div>

</body>
<script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"></script>
</html>
